<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GEPainel — Gestão de Empréstimos</title>
<meta name="description" content="Sistema de gestão de empréstimos e clientes">
<meta name="theme-color" content="#EA580C">
<link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/icons/site.webmanifest">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/themes.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/login.css">
<link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="dark">

<!-- ════ LOGIN PAGE ════ -->
<div id="login-page" class="login-bg">
  <canvas id="stars-canvas"></canvas>
  <div class="login-bg-glow"></div>
  
  <!-- Login Card -->
  <div class="login-card-wrap">
    <div class="login-card">
      <div class="login-card-body">
        
        <!-- Login Panel -->
        <div id="login-panel">
          <h1 class="login-logo">GE<span>Painel</span></h1>
          <p class="login-sub">Gestão de Empréstimos</p>
          
          <div id="login-error" class="login-error"></div>
          
          <div class="login-field">
            <label>Usuário ou e-mail</label>
            <input type="text" id="lu" autocomplete="username" spellcheck="false">
          </div>
          
          <div class="login-field">
            <label>Senha</label>
            <input type="password" id="lp" autocomplete="current-password">
          </div>
          
          <!-- Lembrar acesso -->
          <div style="display:flex;align-items:center;gap:8px;margin:1rem 0">
            <div id="remember-toggle" onclick="toggleRemember()" style="width:44px;height:24px;background:#D1D5DB;border-radius:999px;position:relative;cursor:pointer;transition:all .2s">
              <div id="remember-knob" style="width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:all .2s"></div>
            </div>
            <label onclick="toggleRemember()" style="font-size:13px;color:var(--n3);cursor:pointer">Lembrar acesso</label>
            <span id="remember-status" style="font-size:11px;margin-left:4px"></span>
          </div>
          
          <button id="login-btn" onclick="doLogin()" style="width:100%;padding:.85rem;background:#EA580C;color:#fff;border:none;border-radius:var(--rs);font-weight:600;font-size:15px;cursor:pointer;margin-bottom:1.5rem">Entrar →</button>
          
          <div class="login-hint">
            <a href="javascript:void(0)" onclick="openEsqueciSenha()" style="color:var(--n3);text-decoration:none">Esqueci minha senha</a>
            <span style="color:var(--n5);margin:0 6px">·</span>
            <a href="javascript:void(0)" onclick="showRegister()" style="color:var(--n3);text-decoration:none">Criar conta</a>
          </div>
        </div>
        
        <!-- Register Panel -->
        <div id="register-panel" style="display:none">
          <h1 class="login-logo">GE<span>Painel</span></h1>
          <p class="login-sub">Criar conta — 30 dias grátis</p>
          
          <div id="reg-error" class="login-error"></div>
          
          <div class="login-field">
            <label>Nome completo</label>
            <input type="text" id="reg-nome">
          </div>
          
          <div class="login-field">
            <label>Usuário (login)</label>
            <input type="text" id="reg-login" spellcheck="false">
          </div>
          
          <div class="login-field">
            <label>E-mail</label>
            <input type="email" id="reg-email" autocomplete="email">
          </div>
          
          <div class="login-field">
            <label>Senha (mínimo 4 caracteres)</label>
            <input type="password" id="reg-pass" autocomplete="new-password">
          </div>
          
          <div class="login-field">
            <label>Confirme a senha</label>
            <input type="password" id="reg-pass2" autocomplete="new-password">
          </div>
          
          <div class="login-field">
            <label>Código de indicação (opcional)</label>
            <input type="text" id="reg-indicacao" placeholder="XXXXXXXX" style="text-transform:uppercase">
          </div>
          
          <button id="register-btn" onclick="doRegister()" style="width:100%;padding:.85rem;background:#EA580C;color:#fff;border:none;border-radius:var(--rs);font-weight:600;font-size:15px;cursor:pointer;margin-bottom:1.5rem">Criar conta →</button>
          
          <div class="login-hint">
            <a href="javascript:void(0)" onclick="showLogin()" style="color:var(--n3);text-decoration:none">← Voltar ao login</a>
          </div>
        </div>
        
      </div>
    </div>
  </div>
</div>

<!-- Modal Esqueci Senha -->
<div id="esqueci-senha-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeEsqueciSenha()">
  <div class="modal-box" style="max-width:400px;padding:2rem">
    <h3 style="margin:0 0 .5rem;font-size:1.25rem">Recuperar senha</h3>
    <p style="color:var(--n4);font-size:13px;margin:0 0 1.5rem">Informe seu login ou e-mail. Enviaremos instruções.</p>
    <div id="esqueci-error" class="auth-error" style="margin-bottom:1rem"></div>
    <input type="text" id="esqueci-input" placeholder="Login ou e-mail" style="width:100%;padding:.75rem;border:1px solid var(--n8);border-radius:var(--rs);margin-bottom:1rem">
    <div style="display:flex;gap:8px">
      <button onclick="closeEsqueciSenha()" style="flex:1;padding:.75rem;background:transparent;border:1px solid var(--n8);color:var(--n3);border-radius:var(--rm);cursor:pointer;font-weight:500">Cancelar</button>
      <button id="esqueci-btn" onclick="enviarRecuperacaoSenha()" style="flex:1;padding:.75rem;background:var(--org);color:#fff;border:none;border-radius:var(--rm);cursor:pointer;font-weight:600">Enviar →</button>
    </div>
  </div>
</div>

<!-- ════ APP PAGE ════ -->
<div id="app-page" style="display:none">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="app-body">
    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="topbar-actions">
        <button id="dark-toggle" onclick="toggleDarkMode()" class="icon-btn"></button>
        <button onclick="openGlobalSearch()" class="icon-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
  <nav id="bottom-nav" class="bottom-nav"></nav>
</div>

<!-- Global Search -->
<div id="gsearch-ov" class="gsearch-overlay">
  <div class="gsearch-box">
    <input type="text" id="gsearch-input" placeholder="Buscar..." oninput="runGlobalSearch()">
    <button onclick="closeGlobalSearch()" class="gsearch-close">×</button>
  </div>
  <div id="gsearch-results" class="gsearch-results">
    <div class="gsearch-empty">Digite para buscar...</div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/js/config.js"></script>
<script src="/js/state.js"></script>
<script src="/js/session.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/init.js"></script>
<script src="/js/app.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/clientes.js"></script>
<script src="/js/emprestimos.js"></script>
<script src="/js/parcelas.js"></script>
<script src="/js/pagamento.js"></script>
<script src="/js/relatorios.js"></script>
<script src="/js/perfil.js"></script>
<script src="/js/usuarios.js"></script>
<script src="/js/whatsapp.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/notificacoes.js"></script>
<script src="/js/simulador.js"></script>
<script src="/js/indicacao.js"></script>
<script src="/js/pwa.js"></script>
</body>
</html>
